ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:@PORT@>
    DocumentRoot /var/www/html
    DirectoryIndex index.php
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <DirectoryMatch "^/var/www/html/(database|docs|tests|docker|config|storage|tmp|temp|logs|backups)(/|$)">
        Require all denied
    </DirectoryMatch>
    <LocationMatch "(?i)(^|/)\.(git|github|env|agents|codex|vscode|idea)([./]|$)">
        Require all denied
    </LocationMatch>
    <LocationMatch "(?i)^/shared/(setup|full_setup)\.php$">
        Require all denied
    </LocationMatch>
    <FilesMatch "(?i)(\.(sql|log|ini|bak|dump|cookie|cookies)(\.(gz|zip))?$|^\.env(?:\..*)?$|^Dockerfile$|^\.dockerignore$)">
        Require all denied
    </FilesMatch>
</VirtualHost>
